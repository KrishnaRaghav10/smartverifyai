<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Rim Gradient (Metallic Gold / Saffron) -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#E8890C"/>
    </linearGradient>

    <!-- Main Shield Body Gradient (Deep Royal Navy) -->
    <linearGradient id="shieldBody" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="50%" stop-color="#142C52"/>
      <stop offset="100%" stop-color="#0B1A33"/>
    </linearGradient>

    <!-- Inner Shield Inset Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234A85"/>
      <stop offset="100%" stop-color="#0F203D"/>
    </linearGradient>

    <!-- Tick Gradient (Pure Luminous White) -->
    <linearGradient id="tickGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Tick Glow / Shadow Filter -->
    <filter id="tickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Shield Drop Shadow -->
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B1A33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Shell with Gold Rim -->
  <path d="M50 5 L88 18 C88 56 68 83 50 94 C32 83 12 56 12 18 L50 5 Z" 
        fill="url(#shieldRim)" 
        filter="url(#shieldShadow)"/>

  <!-- Inner Body of the Shield -->
  <path d="M50 8.5 L84.5 20.5 C84.5 54.5 66 79.5 50 89.5 C34 79.5 15.5 54.5 15.5 20.5 L50 8.5 Z" 
        fill="url(#shieldBody)"/>

  <!-- Inset Bevel Contour -->
  <path d="M50 13 L81 23.5 C81 52.5 64.5 75 50 84 C35.5 75 19 52.5 19 23.5 L50 13 Z" 
        fill="url(#innerShield)" 
        stroke="rgba(245, 158, 11, 0.3)" 
        stroke-width="1.2"/>

  <!-- Glass Light Reflection Arc across Upper-Left Quadrant -->
  <path d="M50 13 L81 23.5 C81 38 72 52 50 52 C28 52 19 38 19 23.5 L50 13 Z" 
        fill="url(#glassReflection)"/>

  <!-- Premium Sculpted Tick / Checkmark with Sharp Precision -->
  <path d="M33 49 L43.5 59.5 L67.5 34 L72.5 39 L43.5 68.5 L28 53 Z" 
        fill="url(#tickGradient)" 
        filter="url(#tickShadow)"/>
</svg>
